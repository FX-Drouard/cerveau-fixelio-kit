name: Tester et publier le kit
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Construire et vérifier le ZIP public
        run: python3 scripts/package.py
      - name: Publier sans ajouter de ZIP au dépôt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')"
          tag="kit-build-${RUN_ID}-${RUN_ATTEMPT}"
          flags=(--prerelease)
          if [[ "$BRANCH_NAME" == "$DEFAULT_BRANCH" ]]; then flags=(--latest); fi
          gh release create "$tag" dist/*.zip dist/*.sha256 --target "$COMMIT_SHA" --title "Kit ${version} — ${COMMIT_SHA:0:12}" --notes "Sources du commit ${COMMIT_SHA}. ZIP et manifeste SHA-256 vérifiés automatiquement. Aucun identifiant inclus." "${flags[@]}"
